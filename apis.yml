- type: Features
  data:
  - name: Fully Managed Kafka
    description: Automatically provisions, configures, and maintains Apache Kafka
      clusters without operational overhead.
  - name: High Durability
    description: Multi-AZ deployments with automatic replication and failover for
      data durability.
  - name: MSK Serverless
    description: Serverless cluster mode that automatically scales capacity to match
      streaming demand.
  - name: MSK Connect
    description: Fully managed Kafka Connect to stream data to and from databases
      and other services.
  - name: Tiered Storage
    description: Offload older data to low-cost Amazon S3 storage while keeping recent
      data on brokers.
  - name: Schema Registry
    description: Manage and enforce schemas for Kafka topics with AWS Glue Schema
      Registry integration.
- type: UseCases
  data:
  - name: Real-Time Data Streaming
    description: Build real-time data pipelines for clickstream analytics, log aggregation,
      and metrics.
  - name: Event Sourcing
    description: Implement event sourcing patterns with durable, ordered Kafka topics.
  - name: Stream Processing
    description: Process streaming data with Apache Flink, Spark Streaming, or custom
      consumers.
  - name: Database Change Data Capture
    description: Stream database changes to downstream systems using Debezium and
      MSK Connect.
- type: Integrations
  data:
  - name: Amazon Kinesis Data Analytics
    description: Process MSK streams with Kinesis Data Analytics for Apache Flink.
  - name: AWS Lambda
    description: Trigger Lambda functions from MSK topics for serverless stream processing.
  - name: Amazon S3
    description: Use MSK Connect to sink data from Kafka topics to S3 buckets.
  - name: Amazon CloudWatch
    description: Monitor cluster and broker metrics with CloudWatch dashboards and
      alarms.
  - name: AWS IAM
    description: Authenticate Kafka clients using IAM roles for MSK cluster access
      control.
  - name: AWS Glue Schema Registry
    description: Enforce data schemas for Kafka producers and consumers.
